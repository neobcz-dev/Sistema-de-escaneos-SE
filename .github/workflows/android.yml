name: Compilar APK de Android

# Genera el APK de la app nativa (con el escáner de documentos de Google).
# Se puede disparar a mano ("Run workflow") o se ejecuta al cambiar la app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Aceptar licencias del SDK de Android
        # El runner ya trae el SDK de Android preinstalado; solo hace falta
        # aceptar las licencias para que Gradle descargue lo que falte
        # (plataforma 36, build-tools…). Evitamos android-actions/setup-android
        # porque intenta instalar el paquete obsoleto 'tools' y falla.
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "Usando: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar web + sincronizar Capacitor
        run: npm run build:app

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: escaneos-se-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
